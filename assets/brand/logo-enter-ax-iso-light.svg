<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" fill="none">
  <defs>
    <linearGradient id="axBlueLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="keycapLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="softShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Light Canvas -->
  <rect width="600" height="700" rx="40" fill="#f8fafc"/>

  <!-- Group translated to center -->
  <g transform="translate(44, 10)">
    <!-- ISO 'ㄴ' Enter Keycap Outer Body -->
    <path d="M 236 68 H 376 A 22 22 0 0 1 398 90 V 378 A 22 22 0 0 1 376 400 H 136 A 22 22 0 0 1 114 378 V 236 A 22 22 0 0 1 136 214 H 192 A 22 22 0 0 0 214 192 V 90 A 22 22 0 0 1 236 68 Z"
          fill="url(#keycapLight)"
          stroke="#0f172a"
          stroke-width="12"
          stroke-linejoin="round"
          filter="url(#softShadowLight)"/>

    <!-- Inset Bevel -->
    <path d="M 242 86 H 360 A 14 14 0 0 1 374 100 V 364 A 14 14 0 0 1 360 378 H 152 A 14 14 0 0 1 138 364 V 242 A 14 14 0 0 1 152 228 H 202 A 18 18 0 0 0 220 210 V 100 A 14 14 0 0 1 234 86 Z"
          fill="none"
          stroke="#cbd5e1"
          stroke-width="2.5"/>

    <!-- Return Arrow ↵ in Top Section -->
    <path d="M 346 200 V 144 H 262"
          stroke="#2563eb"
          stroke-width="16"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M 280 126 L 254 144 L 280 162"
          stroke="#2563eb"
          stroke-width="16"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- AX Monogram in Lower Section -->
    <!-- A -->
    <path d="M 166 348 L 208 244 L 250 348 M 180 316 H 236"
          stroke="#0f172a"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <!-- X -->
    <path d="M 268 244 L 352 348 M 352 244 L 268 348"
          stroke="url(#axBlueLight)"
          stroke-width="20"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Wordmark ENTER—AX -->
  <text x="300" y="530"
        font-family="system-ui, -apple-system, sans-serif"
        font-weight="900"
        font-size="52"
        letter-spacing="0.14em"
        fill="#0f172a"
        text-anchor="middle">ENTER—AX</text>

  <!-- Subtitle Tagline -->
  <text x="300" y="575"
        font-family="system-ui, -apple-system, sans-serif"
        font-weight="700"
        font-size="16"
        letter-spacing="0.22em"
        fill="#2563eb"
        text-anchor="middle">ENTERTAINMENT AX OS</text>
</svg>
