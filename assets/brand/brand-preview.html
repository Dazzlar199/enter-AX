<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Enter-AX Brand Identity Showcase - Classic Gray Keycap</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 60px 40px;
      background: #eef1f6;
      color: #111827;
      font-family: "Pretendard Variable", -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }
    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin: 0;
      text-align: center;
      color: #0f172a;
    }
    p {
      color: #64748b;
      font-size: 18px;
      margin: 8px 0 0;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
      max-width: 1100px;
      width: 100%;
    }
    .card {
      background: #ffffff;
      border: 1.5px solid #d8dde6;
      border-radius: 20px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }
    .card h3 {
      font-size: 22px;
      font-weight: 900;
      margin: 0;
      color: #0f172a;
    }
    .card p {
      font-size: 15px;
      color: #64748b;
      margin: 0;
    }
    .preview-box {
      width: 360px;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      overflow: hidden;
    }
    .preview-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div>
    <h1>ENTER—AX 브랜드 아이덴티티: 클래식 그레이 'ㄴ자' 엔터키</h1>
    <p>리얼포스 / 기계식 키보드 고유의 뉴트럴 그레이 키캡 실루엣 + ↵ 리턴 화살표 + 코발트 블루 AX</p>
  </div>

  <div class="grid">
    <div class="card">
      <h3>클래식 키보드 그레이 엔터키 (정면 마크)</h3>
      <p>기계식 키보드 매트 질감 + ↵ 리턴 화살표 + 볼드 코발트 AX</p>
      <div class="preview-box">
        <img src="logo-enter-gray-keycap.jpg" alt="Classic Gray Keycap Logo">
      </div>
    </div>

    <div class="card">
      <h3>순수 벡터 SVG 에디션 (Scalable Vector)</h3>
      <p>키캡 베벨 하이라이트 + 그래파이트 & 코발트 정밀 벡터 코드</p>
      <div class="preview-box">
        <img src="logo-enter-gray-keycap.svg" alt="Gray Keycap SVG Logo">
      </div>
    </div>
  </div>
</body>
</html>
