services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: enter_ax_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - enter_ax_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enter_ax_test"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  enter_ax_pgdata:
